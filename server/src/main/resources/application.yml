server:
  port: 8080

spring:
  application:
    name: ridelog-server
  datasource:
    url: jdbc:h2:file:./data/ridelog;MODE=MySQL
    username: sa
    password:
  h2:
    console:
      enabled: true      # http://localhost:8080/h2-console
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

---
# MySQL 사용 시: ./mvnw spring-boot:run -Dspring-boot.run.profiles=mysql
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: jdbc:mysql://localhost:3306/ridelog?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
